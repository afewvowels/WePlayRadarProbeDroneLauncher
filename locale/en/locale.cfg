[mod-name]
WePlayRadarProbeDroneLauncher=WePlay: Radar Probe Drone Launcher

[mod-description]
WePlayRadarProbeDroneLauncher=Launch survey drones from a 5x5 launch pad. They fly far out into the fog, land, and deploy into slow-scanning radar probes, with buoy versions for water.

[entity-name]
rpdl-drone-launcher=Drone launcher
rpdl-survey-probe=Survey probe
rpdl-survey-buoy=Survey buoy

[entity-description]
rpdl-drone-launcher=Launches survey drones toward the nearest uncharted land. Each drone lands and deploys into a temporary radar probe. Press R to turn the runway.
rpdl-survey-probe=Slowly sweeps the surrounding area, then shuts down.
rpdl-survey-buoy=A survey probe that landed on water and inflated its raft.

[item-name]
rpdl-survey-drone=Survey drone
rpdl-drone-launcher=Drone launcher

[item-description]
rpdl-survey-drone=One-way trip. Load into a drone launcher.

[recipe-name]
rpdl-launch-drone=Launch survey drone

[technology-name]
rpdl-survey-drones=Survey drones
rpdl-drone-range=Survey drone range

[technology-description]
rpdl-survey-drones=Long-range drones that deploy into temporary radar probes.
rpdl-drone-range=Bigger fuel tanks let survey drones fly farther.

[modifier-description]
rpdl-drone-range=Survey drone range: +__1__ tiles

[mod-setting-name]
rpdl-banking=Banking turns
rpdl-fancy-flights=Fancy flight paths
rpdl-drone-map-icons=Show drones on the map
rpdl-base-range=Drone base range (tiles)
rpdl-range-per-level=First range research bonus (tiles)
rpdl-flight-speed=Drone flight speed (tiles per second)
rpdl-launch-interval=Launch interval (seconds)
rpdl-landing-mode=Landing mode
rpdl-risky-failure-chance=Risky landing failure chance
rpdl-announce-finished=Announce finished probes

[mod-setting-description]
rpdl-banking=Drones visibly roll into their turns: the wings narrow and the plane slides toward the inside of the turn.
rpdl-fancy-flights=Drones roll down the launcher's runway, climb out, bank toward their target and fly a straight final approach to land. Turn off for straight-line flights.
rpdl-drone-map-icons=Draw an icon for each drone in flight in map view and chart a narrow trail along its flight path, so you can watch it fly out and land.
rpdl-base-range=How far survey drones can fly before any range research.
rpdl-range-per-level=Range added by the first Survey drone range research. Each later level doubles it (1024, 2048, 4096 by default).
rpdl-flight-speed=How fast survey drones fly. Lower it to follow a drone on its way out.
rpdl-launch-interval=How long the launcher spends preparing each drone before launch.
rpdl-landing-mode=What happens when a drone lands somewhere it can't deploy (water without room, buildings, cliffs, lava).
rpdl-risky-failure-chance=Only used in Risky mode. 0.1 = 10% of deployments malfunction.
rpdl-announce-finished=Print a message with a map link when a probe finishes its sweep.

[string-mod-setting]
rpdl-landing-mode-nudge=Nudge to the nearest valid spot
rpdl-landing-mode-fail=Fail on bad landings
rpdl-landing-mode-risky=Risky: nudge, with random malfunctions

[rpdl]
probe-deployed=Survey drone deployed a __1__ at __2__
probe-lost=Survey drone lost (__1__) at __2__
no-target=Survey drones have charted everything within __1__ tiles. They will keep flying out to refresh the map; research survey drone range to reach new land.
probe-finished=Survey probe finished its sweep at __1__
reason-blocked=no room to deploy
reason-hazard=landed on a hazard
reason-malfunction=malfunction
reason-surface=surface gone
